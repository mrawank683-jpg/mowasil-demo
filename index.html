<style>
  :root { color-scheme: dark; }
  html, body { background: #0D0F12; }
  body { font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  ::selection { background: rgba(229,9,20,0.35); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #0D0F12; }
  ::-webkit-scrollbar-thumb { background: #252C3A; border-radius: 999px; border: 2px solid #0D0F12; }
  ::-webkit-scrollbar-thumb:hover { background: #333c4e; }

  :focus-visible { outline: 2px solid #FF2A2A; outline-offset: 2px; border-radius: 6px; }

  .grid-bg {
    background-image:
      linear-gradient(rgba(255,255,255,0.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.028) 1px, transparent 1px);
    background-size: 44px 44px;
  }

  @keyframes pulseRed { 0%,100% { box-shadow: 0 0 0 0 rgba(255,77,77,0.5);} 50% { box-shadow: 0 0 0 6px rgba(255,77,77,0);} }
  .pulse-red { animation: pulseRed 2s ease-out infinite; }

  @keyframes rowIn { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: none;} }
  .row-in { animation: rowIn .28s ease both; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }

  .modal-scroll { max-height: min(82vh, 900px); }

  /* Print — only the report card */
  @media print {
    body { background: #fff !important; }
    body * { visibility: hidden !important; }
    #print-area, #print-area * { visibility: visible !important; }
    #print-area {
      position: absolute; inset: 0; margin: 0; padding: 24px;
      width: 100%; max-height: none !important; overflow: visible !important;
      background: #fff !important; color: #111 !important; box-shadow: none !important; border: 0 !important;
    }
    #print-area .print-hide { display: none !important; }
    #print-area * { color: #111 !important; border-color: #bbb !important; background: transparent !important; }
    #print-area .print-keep-bg { background: #f3f3f3 !important; }
    @page { margin: 14mm; }
  }
</style>

/* ---------- 5. Password hashing (PBKDF2-SHA256) ------------------------- */
/* In production the salted hash is generated + stored server-side (bcrypt/
   argon2/PBKDF2) and only the hash is compared over TLS with rate-limiting.
   Here we derive it in-browser purely to demonstrate the scheme.           */
const PBKDF2_ITERS = 210000;
const enc = new TextEncoder();
const toHex = (buf) => [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');

async function pbkdf2Hash(password, saltHex) {
  const salt = Uint8Array.from(saltHex.match(/.{2}/g).map((h) => parseInt(h, 16)));
  const key = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt, iterations: PBKDF2_ITERS, hash: 'SHA-256' }, key, 256);
  return toHex(bits);
}
function constantTimeEqual(a, b) {
  if (a.length !== b.length) return false;
  let r = 0;
  for (let i = 0; i < a.length; i++) r |= a.charCodeAt(i) ^ b.charCodeAt(i);
  return r === 0;
}

];
(async () => { for (const acc of ACCOUNTS) acc.hash = await pbkdf2Hash(acc.password, acc.salt); })();

async function verifyLogin(username, password) {
  const uname = username.trim();
  for (const acc of ACCOUNTS) {
    if (uname !== acc.username || !acc.hash) continue;
    const candidate = await pbkdf2Hash(password, acc.salt);
    if (constantTimeEqual(candidate, acc.hash)) return acc;
  }
  return null;
}

/* ---------- 7. Network-node canvas motif ------------------------------ */
let ACTIVE_FIELDS = [];
function stopFields() {
  ACTIVE_FIELDS.forEach((fn) => { try { fn(); } catch (e) {} });
  ACTIVE_FIELDS = [];
}
function nodeField(canvas, density) {
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w, h, nodes, raf;
  function resize() {
    const r = canvas.getBoundingClientRect();
    w = canvas.width = r.width * devicePixelRatio;
    h = canvas.height = r.height * devicePixelRatio;
    const count = Math.max(8, Math.round((r.width * r.height) / density));
    nodes = Array.from({ length: count }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.12 * devicePixelRatio,
      vy: (Math.random() - 0.5) * 0.12 * devicePixelRatio,
    }));
  }
  function frame() {
    ctx.clearRect(0, 0, w, h);
    const R = 120 * devicePixelRatio;
    for (const n of nodes) {
      if (!reduce) { n.x += n.vx; n.y += n.vy; }
      if (n.x < 0 || n.x > w) n.vx *= -1;
      if (n.y < 0 || n.y > h) n.vy *= -1;
    }
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d < R) {
          ctx.strokeStyle = `rgba(229,9,20,${0.16 * (1 - d / R)})`;
          ctx.lineWidth = devicePixelRatio;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
      ctx.fillStyle = 'rgba(255,42,42,0.55)';
      ctx.beginPath(); ctx.arc(nodes[i].x, nodes[i].y, 1.6 * devicePixelRatio, 0, 7); ctx.fill();
    }
    if (!reduce) raf = requestAnimationFrame(frame);
  }
  resize(); frame();
  const ro = new ResizeObserver(() => { resize(); if (reduce) frame(); });
  ro.observe(canvas);
  ACTIVE_FIELDS.push(() => { cancelAnimationFrame(raf); ro.disconnect(); });
}

function statusPill(status) {
  const map = {
    preparing:  ['st_preparing',  'text-info bg-info/10 ring-info/30'],
    in_transit: ['st_in_transit', 'text-warn bg-warn/10 ring-warn/30'],
    delivered:  ['st_delivered',  'text-ok bg-ok/10 ring-ok/30'],
    delayed:    ['st_delayed',    'text-danger bg-danger/10 ring-danger/40'],
    cancelled:  ['st_cancelled',  'text-faint bg-white/5 ring-white/10'],
  };
  const [k, cls] = map[status];
  const dot = status === 'delayed' ? '<span class="w-1.5 h-1.5 rounded-full bg-danger pulse-red"></span>' :
    `<span class="w-1.5 h-1.5 rounded-full bg-current opacity-80"></span>`;
  return `<span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-semibold ring-1 ${cls}">${dot}${t(k)}</span>`;
}
function payPill(s) {
  const map = {
    collected: ['pay_collected', 'text-ok bg-ok/10 ring-ok/30'],
    pending:   ['pay_pending',   'text-warn bg-warn/10 ring-warn/30'],
    cancelled: ['pay_cancelled', 'text-faint bg-white/5 ring-white/10'],
  };
  const [k, cls] = map[s];
  return `<span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-semibold ring-1 ${cls}">${t(k)}</span>`;
}
function finHiddenNote() {
  return `<div class="rounded-2xl bg-surface border border-line p-5 shadow-card flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-2 text-sm text-mute">${icon('shield', 'w-4 h-4 text-faint')}<span>${t('finHiddenBanner')}</span></div>
    <button data-action="nav" data-view="settings" class="text-xs font-semibold text-brand-bright hover:underline whitespace-nowrap">${t('nav_settings')} →</button>
  </div>`;
}
function sparkline(vals, stroke) {
  const w = 92, h = 26, max = Math.max(...vals), min = Math.min(...vals);
  const pts = vals.map((v, i) => {
    const x = (i / (vals.length - 1)) * w;
    const y = h - 2 - ((v - min) / (max - min || 1)) * (h - 4);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" class="w-[92px] h-[26px] overflow-visible" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
function kpiCard({ label, value, icon: ic, delta, trend, accent = 'ink', spark }) {
  const accCls = { ink: 'text-ink', danger: 'text-danger', ok: 'text-ok', warn: 'text-warn', brand: 'text-brand-bright' }[accent];
  const deltaCls = trend === 'up' ? 'text-ok' : trend === 'down' ? 'text-danger' : 'text-mute';
  const arrow = trend === 'up' ? '▲' : trend === 'down' ? '▼' : '•';
  return `<div class="rounded-2xl bg-surface border border-line p-4 flex flex-col gap-3 shadow-card">
    <div class="flex items-start justify-between">
      <span class="text-[11px] uppercase tracking-[.14em] text-mute font-semibold">${esc(label)}</span>
      <span class="text-faint">${icon(ic, 'w-[18px] h-[18px]')}</span>
    </div>
    <div class="font-display font-extrabold text-3xl leading-none tabular-nums ${accCls}">${value}</div>
    <div class="flex items-end justify-between">
      <span class="text-xs font-semibold ${deltaCls} tabular-nums">${arrow} ${esc(delta)}</span>
      ${spark ? sparkline(spark, trend === 'down' ? '#FF4D4D' : '#31C56B') : ''}
    </div>
  </div>`;
}

            <input type="radio" name="fulfil" value="driver" class="accent-brand" ${!isCarrierMode ? 'checked' : ''}>
            <span class="text-sm text-ink">${t('ff_kind_driver')}</span></label>

      </div>
      <div id="carrier-field" class="${isCarrierMode ? '' : 'hidden'} flex flex-col gap-2">
        <label class="block"><span class="text-xs font-semibold text-mute">${t('carrier_word')}</span>
          <input name="carrier" list="carrier-list" placeholder="أرامكس" value="${editing ? esc(editing.carrier || '') : ''}"
            class="mt-1.5 w-full bg-bg border border-line rounded-xl px-3 py-2.5 text-sm text-ink outline-none focus:border-brand" />
          <datalist id="carrier-list">${carrierOpts}</datalist>
        </label>
        <label class="flex items-center gap-2 text-sm text-mute">
          <input type="checkbox" name="waEnabled" class="accent-brand" ${editing && editing.waEnabled ? 'checked' : ''}>
          <span>${t('waOptionalExternal')}</span>
        </label>
        <p class="text-[11px] text-faint">${t('ext_hint')}</p>
      </div>
      <label class="block"><span class="text-xs font-semibold text-mute">${t('eta_datetime')}</span>
        <input name="eta" type="datetime-local" value="${editing && editing.etaAt ? editing.etaAt.slice(0, 16) : ''}"
          class="mt-1.5 w-full bg-bg border border-line rounded-xl px-3 py-2.5 text-sm text-ink outline-none focus:border-brand" /></label>
      <div class="flex justify-end gap-2 pt-1">
        <button type="button" data-action="close-modal" class="px-4 py-2 rounded-xl text-sm font-semibold text-mute hover:text-ink">${t('cancel')}</button>
        <button type="submit" class="px-4 py-2 rounded-xl text-sm font-bold bg-brand hover:bg-brand-bright text-white shadow-glow">${t('save')}</button>
      </div>
    </form>`);
  const form = $('#shipment-form');
  form.querySelectorAll('input[name="fulfil"]').forEach((r) => r.addEventListener('change', () => {
    const carrierMode = form.querySelector('input[name="fulfil"]:checked').value === 'carrier';
    $('#driver-field').classList.toggle('hidden', carrierMode);
    $('#carrier-field').classList.toggle('hidden', !carrierMode);
  }));
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const fulfil = fd.get('fulfil');
    const partyName = fd.get('partyName').trim();
    const cityIdx = Number(fd.get('city'));
    const etaVal = fd.get('eta');
    const etaAt = etaVal ? etaVal + ':00' : null;
    const phone = fd.get('phone');
    const addressText = fd.get('address');
    const rec = editing || { id: null, created: todayISOStr(), status: 'preparing', reason: null, note: '', schedule: [] };
    rec.partyName = partyName; rec.p = rec.p ?? 0; rec.c = cityIdx; rec.phone = phone; rec.address = { ar: addressText, en: addressText }; rec.etaAt = etaAt;
    rec.shipType = fd.get('shipType') || null; rec.invoiceId = fd.get('invoiceId').trim() || null;
    if (fulfil === 'carrier') {
      rec.fulfil = 'carrier';
      rec.carrier = fd.get('carrier').trim() || (CARRIERS[0] ? CARRIERS[0][STATE.lang] : 'أرامكس');
      if (!CARRIERS.some((c) => c.ar === rec.carrier || c.en === rec.carrier)) CARRIERS.push({ id: 'x_' + Math.random().toString(36).slice(2, 7), ar: rec.carrier, en: rec.carrier });
      rec.driver = null;
      rec.waEnabled = fd.get('waEnabled') === 'on';
    } else {
      rec.fulfil = 'driver';
      rec.driver = fd.get('driver');
      rec.carrier = null;
      rec.waEnabled = true;
    }
    if (!editing) {
      const nums = SHIPMENTS.map((s) => parseInt(s.id.replace(/\D/g, ''), 10)).filter((n) => !isNaN(n));
      rec.id = `MW-${(nums.length ? Math.max(...nums) : 24830) + 1}`;
      SHIPMENTS.push(rec);
    }
    closeModal();
    renderView();
  });
}

function viewFleet() {
  const cards = FLEET.map((v, idx) => {
    const lvl = serviceLevel(v);
    const d = daysBetween(v.nextDate);
    const badge = {
      urgent: `<span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-bold text-danger bg-danger/10 ring-1 ring-danger/40">${icon('alert', 'w-3.5 h-3.5')}${t('serviceUrgent')}</span>`,
      due: `<span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-bold text-warn bg-warn/10 ring-1 ring-warn/30">${icon('clock', 'w-3.5 h-3.5')}${t('serviceDue')}</span>`,
      ok: `<span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-semibold text-ok bg-ok/10 ring-1 ring-ok/30">${icon('check', 'w-3.5 h-3.5')}${t('serviceOk')}</span>`,
    }[lvl];

        <div><div class="text-[11px] uppercase tracking-wider text-faint">${t('col_status')}</div>
          <div class="${vs} font-semibold">${t('vs_' + v.vstatus)}</div></div>

          <div class="text-ink tabular-nums">${v.odo.toLocaleString('en-US')} كم</div></div>

      </div>
      <div class="rounded-xl px-3 py-2.5 flex items-center justify-between

        <div class="text-xs">
          <span class="text-faint">${t('nextService')}: </span>

  }).join('');

  return `

function nextInvoiceId() {
  const nums = INVOICES.map((iv) => parseInt(iv.id.replace(/\D/g, ''), 10)).filter((n) => !isNaN(n));
  return `INV-${(nums.length ? Math.max(...nums) : 7780) + 1}`;
}

function openModal(html, { wide = false } = {}) {
  const host = $('#modal-host');

      <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" data-action="close-modal"></div>

        modal-scroll overflow-y-auto">${html}</div>
    </div>`;
  const focusable = host.querySelector('button, input, select, [tabindex]');
  if (focusable) focusable.focus();
  document.addEventListener('keydown', escClose);

  $('#modal-host').innerHTML = '';

function escClose(e) { if (e.key === 'Escape') closeModal(); }

async function downloadReportPDF(btn) {
  const el = document.getElementById('print-area');
  if (!el || !window.html2canvas || !window.jspdf) return;
  const label = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = t('generatingPdf'); }
  try {
    const canvas = await html2canvas(el, {
      scale: 2,
      backgroundColor: '#ffffff',
      ignoreElements: (node) => node.classList && node.classList.contains('print-hide'),
    });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const imgW = pageW;
    const imgH = (canvas.height * imgW) / canvas.width;
    const imgData = canvas.toDataURL('image/png');
    let heightLeft = imgH;
    let position = 0;
    pdf.addImage(imgData, 'PNG', 0, position, imgW, imgH);
    heightLeft -= pageH;
    while (heightLeft > 0) {
      position = heightLeft - imgH;
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', 0, position, imgW, imgH);
      heightLeft -= pageH;
    }
    pdf.save(`Mowasil-Report-${todayISOStr()}.pdf`);
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = label; }
  }
}

/* ---------- 13. Global event delegation --------------------------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  if (a === 'nav') {
    const allowed = STATE.role === 'driver' ? ['mytrips']
      : STATE.role === 'manager' ? ['dashboard', 'settings']
      : ['dashboard', 'shipments', 'fleet', 'invoices', 'settings'];
    let view = el.dataset.view;
    if (!allowed.includes(view)) view = allowed[0];
    STATE.view = view;
    renderApp();
  }
  else if (a === 'choose-org') { STATE.mode = el.dataset.mode; STATE.orgChosen = true; render(); }
  else if (a === 'switch-org') { STATE.orgChosen = false; render(); }
  else if (a === 'choose-role') { STATE.pendingRole = el.dataset.role; STATE.roleChosen = true; render(); }
  else if (a === 'back-to-role') { STATE.roleChosen = false; render(); }
  else if (a === 'lang') { STATE.lang = STATE.lang === 'ar' ? 'en' : 'ar'; render(); }
  else if (a === 'report') openWeeklyReport();
  else if (a === 'logout') { STATE.authed = false; STATE.orgChosen = false; STATE.roleChosen = false; STATE.pendingRole = null; STATE.role = null; STATE.driverId = null; STATE.view = 'dashboard'; render(); }
  else if (a === 'filter') { STATE.shipmentFilter = el.dataset.key; renderView(); }
  else if (a === 'edit-delay') openDelayDialog(el.dataset.id, el.dataset.autoWa === '1');
  else if (a === 'add-invoice') openInvoiceDialog();
  else if (a === 'add-shipment') openShipmentDialog(null);
  else if (a === 'add-ship-type') {
    const input = document.getElementById('new-ship-type-input');
    const name = input.value.trim();
    if (name) { SHIP_TYPES.push({ id: 'x_' + Math.random().toString(36).slice(2, 7), ar: name, en: name }); renderView(); }
  }
  else if (a === 'delete-ship-type') { SHIP_TYPES = SHIP_TYPES.filter((st) => st.id !== el.dataset.id); renderView(); }
  else if (a === 'toggle-shiptype') {
    STATE.showShipType = !STATE.showShipType;
    try { localStorage.setItem('mowasil_show_shiptype', STATE.showShipType ? '1' : '0'); } catch (e) {}
    renderView();
  }
  else if (a === 'add-driver') {
    const input = document.getElementById('new-driver-input');
    const name = input.value.trim();
    if (name) { DRIVERS.push({ id: 'd_' + Math.random().toString(36).slice(2, 7), ar: name, en: name }); renderView(); }
  }
  else if (a === 'delete-driver') { DRIVERS = DRIVERS.filter((d) => d.id !== el.dataset.id); renderView(); }
  else if (a === 'save-wa-report') {
    WA_REPORT_CONFIG.number = document.getElementById('wa-report-number').value.trim();
    WA_REPORT_CONFIG.freq = document.getElementById('wa-report-freq').value;
    try { localStorage.setItem('mowasil_wa_report', JSON.stringify(WA_REPORT_CONFIG)); } catch (e) {}
    renderView();
  }
  else if (a === 'edit-shipment') openShipmentDialog(el.dataset.id);
  else if (a === 'advance-status') {
    const sp = SHIPMENTS.find((x) => x.id === el.dataset.id);
    if (sp) { sp.status = el.dataset.to; if (sp.status !== 'delayed') sp.reason = null; }
    renderView();
  }
  else if (a === 'quick-login') {
    const acc = ACCOUNTS.find((x) => x.role === el.dataset.role);
    if (acc) {
      const uEl = document.querySelector('#login-form [name="username"]');
      const pEl = document.querySelector('#login-form [name="password"]');
      if (uEl) uEl.value = acc.username;
      if (pEl) pEl.value = acc.password;
    }
  }
  else if (a === 'close-modal') closeModal();
  else if (a === 'print-report') window.print();
  else if (a === 'download-pdf') downloadReportPDF(el);
  else if (a === 'toggle-fin') {
    STATE.showFinancials = !STATE.showFinancials;
    try { localStorage.setItem('mowasil_show_financials', STATE.showFinancials ? '1' : '0'); } catch (e) {}
    renderView();
  }
});
document.addEventListener('input', (e) => {
  const el = e.target.closest('[data-action="search"]');
  if (!el) return;
  STATE.shipmentQuery = el.value;
  const tbody = $('#view table tbody');
  // light refresh: re-render just the view, keep focus
  const pos = el.selectionStart;
  renderView();
  const again = $('[data-action="search"]');
  if (again) { again.focus(); again.setSelectionRange(pos, pos); }
});

/* ---------- 14. Boot ---------------------------------------------- */
render();
</script>
